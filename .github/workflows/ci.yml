name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this job only checks out code and runs local tooling.
permissions:
  contents: read

# Cancel superseded runs for the same PR — a newer push makes the in-flight
# run's result irrelevant. Push runs on `main` are keyed by commit SHA instead,
# so two merges in quick succession never cancel each other and every commit on
# `main` keeps a completed check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck e2e specs
        run: npx tsc --noEmit -p e2e/tsconfig.json

      - name: Run unit tests
        run: npx vitest run

      - name: Lint
        run: npx eslint .
