name: E2E Smoke Tests

on:
  # Run against the Vercel preview deployment as soon as it is ready.
  # The deployment URL is available directly in the event payload so no
  # localhost server needs to start in CI.
  deployment_status:
  # Keep manual dispatch so the suite can be run against any URL on demand
  # (e.g. a hotfix branch, staging, or production for a one-off check).
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to run smoke tests against"
        required: false
        default: "https://www.getfillright.com"
        type: string

# Cancel an in-progress run for the same environment+branch when a newer
# deployment comes in (e.g. two quick pushes to the same PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment.environment }}-${{ github.event.deployment.ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke tests
    # deployment_status: only run once Vercel marks the Preview deployment ready.
    # workflow_dispatch: always run.
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser system deps (cached hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run smoke tests
        run: npx playwright test --project=chromium
        env:
          # deployment_status supplies the preview URL; workflow_dispatch falls
          # back to the user-supplied input or the production URL.
          BASE_URL: ${{ github.event.deployment_status.target_url || inputs.base_url || 'https://www.getfillright.com' }}
          FEATURE_ROUTE_PLANNER: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
